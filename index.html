<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="TicTacToe.css">
</head>
<body>
    <!-- Confetti Canvas for Winner Celebration -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Winner / Draw Announcement -->
    <div class="msg-container hide">
        <p id="msg">Winner</p>
        <div class="msg-btn-group">
            <button id="new-btn">Play Again</button>
            <button id="new-players-btn">New Game</button>
        </div>
    </div>

    <!-- Player Name Entry Modal (Opens when clicking Start Game) -->
    <div id="player-modal" class="modal-overlay hide">
        <div class="glass-card">
            <h2>Player Names</h2>
            <form id="player-form" onsubmit="return false;">
                <div class="input-group">
                    <label for="player-o-name">Player O (First Move)</label>
                    <input type="text" id="player-o-name" placeholder="Enter Player O name" maxlength="15" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="player-x-name">Player X (Second Move)</label>
                    <input type="text" id="player-x-name" placeholder="Enter Player X name" maxlength="15" autocomplete="off">
                </div>
                <div class="modal-btn-group">
                    <button type="submit" id="confirm-start-btn">Start Playing</button>
                    <button type="button" id="cancel-modal-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <main>
        <h1>Tic Tac Toe</h1>

        <!-- In-game Turn Indicator -->
        <div id="turn-indicator" class="turn-indicator hide">
            Turn: <span id="turn-player-name">Player O</span> (<span id="turn-player-symbol" class="symbol-o">O</span>)
        </div>

        <div class="container">
            <div class="game">
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>

        <div class="controls">
            <button id="start-btn">Start Game</button>
            <button id="reset-btn" class="hide">Reset Game</button>
            <button id="change-player-btn" class="hide">Change Players</button>
        </div>
    </main>
    
    <script src="TicTacToe.js"></script>   
</body>
</html>
